name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build Project
        run: dotnet build

      - name: Run Tests
        run: dotnet test --no-build --logger trx --results-directory TestResults

      - name: Upload Test Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence
          path: |
            TestResults/**
            Source/0Bins/Other/AssetRipper.Tests/*/TestResults/managed-roundtrip/**
            Source/0Bins/Other/AssetRipper.Tests/*/TestResults/unity-reference/**
          retention-days: 7
