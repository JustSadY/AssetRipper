name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build Project
        run: dotnet build

      - name: Run Tests
        run: dotnet test --no-build --logger trx --results-directory TestResults

      - name: Upload Test Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence
          path: |
            TestResults/**
            Source/0Bins/Other/AssetRipper.IO.Files.Tests/*/TestResults/serialized-file23/**
            Source/0Bins/Other/AssetRipper.Tests/*/TestResults/serialized-file23/**
            Source/0Bins/Other/AssetRipper.Tests/*/TestResults/managed-roundtrip/**
            Source/0Bins/Other/AssetRipper.Tests/*/TestResults/unity-reference/**
            Source/0Bins/Other/AssetRipper.Tests/*/TestResults/type-recovery/**
            Source/0Bins/Other/AssetRipper.Tests/*/TestResults/monobehaviour-payload/**
            Source/0Bins/Other/AssetRipper.Tests/*/TestResults/unity-editor-payload/**
            Source/0Bins/Other/AssetRipper.Tests/*/TestResults/unity-editor-roundtrip/*/*.json
            Source/0Bins/Other/AssetRipper.Tests/*/TestResults/unity-editor-roundtrip/*/Evidence/**
            Source/0Bins/Other/AssetRipper.Tests/*/TestResults/unity-managed-reference/*/*.json
            Source/0Bins/Other/AssetRipper.Tests/*/TestResults/unity-managed-reference/*/Evidence/**
            Source/0Bins/Other/AssetRipper.Tests/*/TestResults/unity-scene/*/*.json
            Source/0Bins/Other/AssetRipper.Tests/*/TestResults/unity-scene/*/Evidence/**
            Source/0Bins/Other/AssetRipper.Tests/*/TestResults/unity-prefab/*/*.json
            Source/0Bins/Other/AssetRipper.Tests/*/TestResults/unity-prefab/*/Evidence/**
            Source/0Bins/Other/AssetRipper.Tests/*/TestResults/unity-assembly-graph/*/*.json
            Source/0Bins/Other/AssetRipper.Tests/*/TestResults/unity-assembly-graph/*/PrimaryContent/*.json
            Source/0Bins/Other/AssetRipper.Tests/*/TestResults/unity-assembly-graph/*/Evidence/**
            Source/0Bins/Other/AssetRipper.Tests/*/TestResults/il2cpp-capability/*/*.json
            Source/0Bins/Other/AssetRipper.Tests/*/TestResults/il2cpp-capability/*/*/behavior.json
            Source/0Bins/Other/AssetRipper.Tests/*/TestResults/il2cpp-capability/*/Evidence/**
          retention-days: 7
